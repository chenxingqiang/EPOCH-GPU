name: CI

# Controls when the action will run.
on:
  pull_request:
    branches:
    - main
    - '*-devel'
  pull_request_review:
    branches:
    - main
    - '*-devel'
  push:
    branches:
    - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # ===========================================
  # CPU Build and Test (Original EPOCH)
  # ===========================================
  build_and_test_cpu:
    name: CPU Build (${{ matrix.mode || 'release' }})
    if: github.event_name != 'pull_request_review' ||
        contains(github.event.pull_request.labels.*.name, 'auto-pr')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - mode: debug
          flag: -b
          define:
        - mode: debug
          flag: -b
          define: >-
            -DPER_SPECIES_WEIGHT -DZERO_CURRENT_PARTICLES -DNO_PARTICLE_PROBES
            -DPARTICLE_SHAPE_TOPHAT -DPARTICLE_ID -DPHOTONS -DTRIDENT_PHOTONS
            -DBREMSSTRAHLUNG -DPARSER_DEBUG -DNO_IO
            -DPER_PARTICLE_CHARGE_MASS -DPARSER_CHECKING -DNO_USE_ISATTY
            -DWORK_DONE_INTEGRATED -DHC_PUSH -DNO_MPI3 -DDECK_DEBUG
        - mode:
          flag:
          define:

    env:
      COMPILER: gfortran
      MPIPROCS: 2
      MODE: ${{ matrix.mode }}
      DEFINE: ${{ matrix.define }}
      GH_BASE: ${{ github.event.pull_request.base.ref }}
      GH_HEAD: ${{ github.event.pull_request.head.ref }}
      GH_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
    - name: Install dependencies
      run: |
        sudo apt update &&
        sudo apt install -y python3-dev python3-numpy python3-nose python3-matplotlib libpython3-dev openmpi-bin libopenmpi-dev
        pip install sdfr

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Merge branch
      if: github.event_name == 'pull_request'
      run: git config user.email "test@example.com" &&
           git config user.name "test" &&
           git checkout -b $GH_HEAD $GH_SHA &&
           git checkout -b $GH_BASE origin/$GH_BASE &&
           git merge --no-ff $GH_HEAD

    - name: Cleanup
      run: cd epoch1d && make cleanall &&
           cd ../epoch2d && make cleanall &&
           cd ../epoch3d && make cleanall

    - name: Compile and run tests
      run: ./scripts/run-tests-epoch-all.sh ${{ matrix.flag }}

  # ===========================================
  # Python Package Test
  # ===========================================
  test_python_package:
    name: Python Package Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy matplotlib

    - name: Install epoch-gpu package
      run: pip install -e .

    - name: Run Python tests
      run: |
        cd python/tests
        python -m pytest test_epoch_gpu.py -v

    - name: Test CLI tools
      run: |
        epoch-gpu-info --json

  # ===========================================
  # GPU Syntax Check (No GPU Hardware Required)
  # ===========================================
  gpu_syntax_check:
    name: GPU Code Syntax Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install gfortran
      run: |
        sudo apt update
        sudo apt install -y gfortran

    - name: Check GPU module syntax (1D)
      run: |
        cd epoch1d/src/gpu
        for f in *.F90; do
          echo "Checking $f..."
          gfortran -fsyntax-only -cpp -DGPU_ENABLED $f 2>&1 || true
        done

    - name: Check GPU module syntax (2D)
      run: |
        cd epoch2d/src/gpu
        for f in *.F90; do
          echo "Checking $f..."
          gfortran -fsyntax-only -cpp -DGPU_ENABLED $f 2>&1 || true
        done

    - name: Check GPU module syntax (3D)
      run: |
        cd epoch3d/src/gpu
        for f in *.F90; do
          echo "Checking $f..."
          gfortran -fsyntax-only -cpp -DGPU_ENABLED $f 2>&1 || true
        done

  # ===========================================
  # GPU Build Test (Requires NVIDIA HPC SDK)
  # Runs on self-hosted GPU runner or manually
  # ===========================================
  build_gpu:
    name: GPU Build Test
    runs-on: ubuntu-latest
    # Only run on manual dispatch or when GPU label is added
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Check for NVIDIA HPC SDK
      id: check_nvfortran
      run: |
        if command -v nvfortran &> /dev/null; then
          echo "nvfortran_available=true" >> $GITHUB_OUTPUT
          nvfortran --version
        else
          echo "nvfortran_available=false" >> $GITHUB_OUTPUT
          echo "NVIDIA HPC SDK not found - skipping GPU compilation"
        fi

    - name: Build SDF library
      if: steps.check_nvfortran.outputs.nvfortran_available == 'true'
      run: |
        cd SDF/FORTRAN
        make COMPILER=nvfortran

    - name: Build epoch1d GPU
      if: steps.check_nvfortran.outputs.nvfortran_available == 'true'
      run: |
        cd epoch1d
        make -f Makefile.gpu GPU_CC=cc70 || echo "GPU build requires nvfortran"

    - name: Build epoch2d GPU
      if: steps.check_nvfortran.outputs.nvfortran_available == 'true'
      run: |
        cd epoch2d
        make -f Makefile.gpu GPU_CC=cc70 || echo "GPU build requires nvfortran"

    - name: Build epoch3d GPU
      if: steps.check_nvfortran.outputs.nvfortran_available == 'true'
      run: |
        cd epoch3d
        make -f Makefile.gpu GPU_CC=cc70 || echo "GPU build requires nvfortran"
