<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120">
  <defs>
    <linearGradient id="gpuGradLarge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#76b900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a651;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="epochGradLarge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="120" fill="transparent"/>
  
  <!-- EPOCH text with shadow -->
  <text x="20" y="85" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#epochGradLarge)" filter="url(#shadow)" font-style="italic">
    EPOCH
  </text>
  
  <!-- Separator line -->
  <rect x="320" y="25" width="4" height="70" fill="#76b900" rx="2"/>
  
  <!-- GPU badge -->
  <rect x="340" y="20" width="140" height="80" rx="12" ry="12" fill="url(#gpuGradLarge)" filter="url(#shadow)"/>
  <text x="410" y="75" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">
    GPU
  </text>
  
  <!-- Stylized GPU chip icon -->
  <g transform="translate(500, 25)" filter="url(#shadow)">
    <rect x="0" y="10" width="60" height="50" rx="6" fill="#2a2a2a"/>
    <rect x="8" y="18" width="44" height="34" fill="#76b900"/>
    <!-- Connection pins left -->
    <rect x="-8" y="20" width="12" height="6" fill="#555"/>
    <rect x="-8" y="32" width="12" height="6" fill="#555"/>
    <rect x="-8" y="44" width="12" height="6" fill="#555"/>
    <!-- Connection pins right -->
    <rect x="56" y="20" width="12" height="6" fill="#555"/>
    <rect x="56" y="32" width="12" height="6" fill="#555"/>
    <rect x="56" y="44" width="12" height="6" fill="#555"/>
    <!-- Connection pins top -->
    <rect x="15" y="2" width="6" height="12" fill="#555"/>
    <rect x="27" y="2" width="6" height="12" fill="#555"/>
    <rect x="39" y="2" width="6" height="12" fill="#555"/>
    <!-- Connection pins bottom -->
    <rect x="15" y="56" width="6" height="12" fill="#555"/>
    <rect x="27" y="56" width="6" height="12" fill="#555"/>
    <rect x="39" y="56" width="6" height="12" fill="#555"/>
    <!-- GPU die details -->
    <rect x="15" y="25" width="8" height="8" fill="#9acd32"/>
    <rect x="26" y="25" width="8" height="8" fill="#9acd32"/>
    <rect x="37" y="25" width="8" height="8" fill="#9acd32"/>
    <rect x="15" y="37" width="8" height="8" fill="#9acd32"/>
    <rect x="26" y="37" width="8" height="8" fill="#9acd32"/>
    <rect x="37" y="37" width="8" height="8" fill="#9acd32"/>
  </g>
</svg>

